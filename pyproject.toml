[project]
name = "soar-form-service-app"
version = "1.0.0"
description = "Splunk SOAR connector app for the external single-use form service"
requires-python = ">=3.11"
dependencies = []

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]
"service/tests/*" = ["S", "B"]
"service/scripts/*" = ["S310"]  # only local service URLs and $SOAR_URL
