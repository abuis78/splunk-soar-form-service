<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
  <style>
    .bg{fill:#ffffff}.lane1{fill:#eef5ef}.lane2{fill:#fbf3e6}.lane3{fill:#f3eff8}.lane0{fill:#eaf1fb}
    .box{fill:#ffffff;stroke-width:1.5}.s0{stroke:#3a6fb8}.s1{stroke:#3d8a52}.s2{stroke:#b0721c}.s3{stroke:#7a5aa8}
    .t{font-weight:700;fill:#18202b}.x{fill:#18202b}.m{font-family:SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px;fill:#18202b}
    .mu{fill:#5a6577}.lane{font-weight:700;font-size:14px;fill:#18202b}.sub{fill:#5a6577;font-size:12px}
    .f{fill:none;stroke:#0f6e78;stroke-width:2}.n{fill:#0f6e78}.nt{fill:#ffffff;font-weight:700;font-size:11px;text-anchor:middle}
    .el{fill:#0f6e78;font-size:11.5px;font-weight:600}.opt{fill:none;stroke:#5a6577;stroke-width:1.3;stroke-dasharray:5 4}
    @media (prefers-color-scheme: dark){
      .bg{fill:#12161c}.lane0{fill:#18263a}.lane1{fill:#172a1f}.lane2{fill:#2c2416}.lane3{fill:#241e31}
      .box{fill:#1a2029}.t,.x,.m,.lane{fill:#e3e8ef}.mu,.sub{fill:#9aa5b5}
      .f{stroke:#4fb8c2}.n{fill:#4fb8c2}.nt{fill:#12161c}.el{fill:#4fb8c2}.opt{stroke:#9aa5b5}
    }
  </style>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="n"/></marker></defs>
  <rect class="bg" width="1100" height="520"/>
  <rect class="lane0" y="0" width="1100" height="95"/>
  <rect class="lane1" y="95" width="1100" height="140"/>
  <rect class="lane2" y="235" width="1100" height="145"/>
  <rect class="lane3" y="380" width="1100" height="140"/>
  <text class="lane" x="14" y="40">Splunk ES 8.x</text><text class="sub" x="14" y="58">optional</text>
  <text class="lane" x="14" y="160">Splunk SOAR</text><text class="sub" x="14" y="178">this app</text>
  <text class="lane" x="14" y="300">Form service</text><text class="sub" x="14" y="318">service/ (HTTPS)</text>
  <text class="lane" x="14" y="445">External user</text><text class="sub" x="14" y="463">no SOAR account</text>

  <rect class="box s0" x="150" y="18" width="250" height="60" rx="6"/>
  <text class="t" x="162" y="40">Finding / investigation</text>
  <text class="x" x="162" y="60">Run playbook (ES-type playbooks)</text>
  <rect class="box s0" x="760" y="18" width="320" height="60" rx="6"/>
  <text class="t" x="772" y="40">Results in the investigation</text>
  <text class="x" x="772" y="60">notes, finding, file (via ES app actions)</text>

  <rect class="box s1" x="150" y="112" width="330" height="106" rx="6"/>
  <text class="t" x="162" y="134">Request playbook</text>
  <text class="m" x="162" y="156">create form link</text><text class="mu" x="290" y="156">(this app)</text>
  <text class="m" x="162" y="176">send email</text><text class="mu" x="246" y="176">(any mail app, link = url)</text>
  <text class="m" x="162" y="196">get link status / revoke link</text>
  <rect class="box s1" x="700" y="112" width="380" height="106" rx="6"/>
  <text class="t" x="712" y="134">Container + response playbook</text>
  <text class="x" x="712" y="156">artifact label <tspan class="m">form_response</tspan>, cef = form fields</text>
  <text class="x" x="712" y="176">file in the container vault (<tspan class="m">*_vault_id</tspan>)</text>
  <text class="x" x="712" y="196">playbook filters on the label and acts</text>

  <rect class="box s2" x="150" y="255" width="330" height="106" rx="6"/>
  <text class="t" x="162" y="277">API (Bearer key)</text>
  <text class="m" x="162" y="299">POST /api/links  GET /api/forms</text>
  <text class="m" x="162" y="319">GET|DELETE /api/links/&lt;id&gt;</text>
  <text class="mu" x="162" y="341">token stored as SHA-256, single use, TTL</text>
  <rect class="box s2" x="700" y="255" width="380" height="106" rx="6"/>
  <text class="t" x="712" y="277">Hand-off to SOAR (REST, automation token)</text>
  <text class="m" x="712" y="299">POST /rest/container_attachment</text>
  <text class="m" x="712" y="319">POST /rest/artifact  run_automation: true</text>
  <text class="mu" x="712" y="341">forms: JSON files in FORM_DIR</text>

  <rect class="box s3" x="330" y="400" width="300" height="100" rx="6"/>
  <text class="t" x="342" y="422">E-mail with magic link</text>
  <text class="m" x="342" y="444">https://forms.example.com/f/&lt;token&gt;</text>
  <text class="mu" x="342" y="466">valid once, expires (default 24 h)</text>
  <rect class="box s3" x="700" y="400" width="380" height="100" rx="6"/>
  <text class="t" x="712" y="422">Fill in form, upload file</text>
  <text class="m" x="712" y="444">GET / POST /f/&lt;token&gt;</text>
  <text class="mu" x="712" y="466">multipart, size limit, file type check</text>

  <path class="opt" d="M275 78V110" marker-end="url(#a)"/>
  <path class="f" d="M230 218V253" marker-end="url(#a)"/>
  <path class="f" d="M290 253V220" marker-end="url(#a)"/>
  <path class="f" d="M480 186H560V398" marker-end="url(#a)"/>
  <path class="f" d="M630 450H698" marker-end="url(#a)"/>
  <path class="f" d="M890 400V363" marker-end="url(#a)"/>
  <path class="f" d="M890 255V220" marker-end="url(#a)"/>
  <path class="opt" d="M920 112V80" marker-end="url(#a)"/>

  <circle class="n" cx="275" cy="95" r="10"/><text class="nt" x="275" y="99">1</text>
  <circle class="n" cx="214" cy="236" r="10"/><text class="nt" x="214" y="240">2</text>
  <text class="el" x="300" y="240">url, link_id</text>
  <circle class="n" cx="560" cy="300" r="10"/><text class="nt" x="560" y="304">3</text>
  <text class="el" x="572" y="330">mail</text>
  <circle class="n" cx="664" cy="450" r="10"/><text class="nt" x="664" y="454">4</text>
  <circle class="n" cx="890" cy="381" r="10"/><text class="nt" x="890" y="385">5</text>
  <circle class="n" cx="890" cy="236" r="10"/><text class="nt" x="890" y="240">6</text>
  <text class="el" x="905" y="240">artifact + vault</text>
  <circle class="n" cx="920" cy="95" r="10"/><text class="nt" x="920" y="99">7</text>
</svg>
